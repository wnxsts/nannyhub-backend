databaseChangeLog:
  - changeSet:
      id: 005-create-swipes
      author: zhanel
      changes:
        - createTable:
            tableName: swipes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: from_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: to_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: swipes
            columnNames: from_user_id, to_user_id
            constraintName: uk_swipe_from_to
