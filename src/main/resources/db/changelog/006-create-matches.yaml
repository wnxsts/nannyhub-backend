databaseChangeLog:
  - changeSet:
      id: 006-create-matches
      author: zhanel
      changes:
        - createTable:
            tableName: matches
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_a_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_b_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false