databaseChangeLog:
  - changeSet:
      id: 003-create-nanny-profiles
      author: zhanel
      changes:
        - createTable:
            tableName: nanny_profiles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: city
                  type: VARCHAR(255)

        - addForeignKeyConstraint:
            baseTableName: nanny_profiles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_nanny_profiles_user
            onDelete: CASCADE